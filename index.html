<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Ianne v6.6.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .sugestao-item { border-bottom: 1px solid #f3f4f6; }
        .sugestao-item:last-child { border-bottom: none; }
        body { padding-bottom: 110px; } /* Evita que o conteúdo fique escondido atrás da barra fixa inferior robusta */
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen overflow-x-hidden">

    <header class="bg-purple-800 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center relative">
            <div class="flex items-center space-x-2">
                <span class="material-icons text-purple-300">insights</span>
                <span id="tituloPagina" class="text-lg font-bold">Insights do Mês</span>
            </div>
            <div class="flex items-center space-x-2 relative">
                <span id="contadorFila" class="hidden absolute -left-5 -top-2 text-[10px] bg-red-600 text-white px-1.5 py-0.5 rounded-full font-bold shadow">0</span>
                <span id="statusApp" class="text-[10px] bg-amber-500 text-white px-2 py-1 rounded-full font-mono font-bold animate-pulse">SYNC</span>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">

        <section id="pagDashboard" class="space-y-4">
            <div id="carrosselSaldos" class="flex space-x-3 overflow-x-auto pb-2 scrollbar-none snap-x snap-mandatory">
                <div class="min-w-[85%] bg-gradient-to-br from-purple-900 to-purple-950 text-white p-4 rounded-2xl shadow-sm flex justify-between items-center snap-center">
                    <div>
                        <p class="text-[10px] font-bold uppercase tracking-wider opacity-60">Saldo Vivo Geral</p>
                        <h3 id="widgetSaldoTotal" class="text-xl font-black mt-0.5">R$ 0,00</h3>
                    </div>
                    <span class="material-icons opacity-40 text-2xl">account_balance_wallet</span>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm text-center space-y-6">
                <div>
                    <p id="dashMes" class="text-xs font-bold text-gray-400 uppercase tracking-widest">Sincronizando...</p>
                    <h2 class="text-3xl font-black text-gray-800">Fechamento</h2>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                        <p class="text-[10px] font-bold text-emerald-800 uppercase">Receita</p>
                        <p id="dashReceita" class="text-lg font-bold text-emerald-600">R$ 0,00</p>
                    </div>
                    <div class="bg-red-50 p-4 rounded-2xl border border-red-100">
                        <p class="text-[10px] font-bold text-red-800 uppercase">Gastos</p>
                        <p id="dashGastos" class="text-lg font-bold text-red-600">R$ 0,00</p>
                    </div>
                </div>
                <div class="p-5 bg-purple-900 rounded-3xl text-white relative overflow-hidden">
                    <div class="relative z-10">
                        <p class="text-xs font-bold opacity-70 uppercase mb-1">Taxa de Investimento</p>
                        <p id="dashTaxa" class="text-4xl font-black">0%</p>
                    </div>
                </div>

                <div class="text-left space-y-2 border-t pt-4">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Evolução de Aportes</h4>
                    <div id="historicoTaxasLinhas" class="space-y-1.5 text-xs font-bold"></div>
                </div>

                <div class="text-left space-y-3">
                    <h3 class="text-sm font-bold text-gray-800 flex items-center space-x-2">
                        <span class="material-icons text-purple-600 text-lg">psychology</span><span>Motor de Insights</span>
                    </h3>
                    <div id="containerInsights" class="space-y-2">
                        <p class="text-xs text-gray-400 italic">Clique abaixo para processar os dados vivos.</p>
                    </div>
                </div>
                
                <button onclick="puxarDashboardReal()" id="btnRecarregarDash" class="w-full bg-purple-50 hover:bg-purple-100 text-purple-800 font-bold py-3 text-xs border border-purple-200 rounded-xl transition active:scale-98">
                    ATUALIZAR DADOS DO SHEETS
                </button>
            </div>
        </section>

        <section id="pagLancamento" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="fluxo_despesa" onclick="setFluxo('Despesa')" class="py-2.5 rounded-xl font-bold text-xs bg-red-500 text-white">Despesa</button>
                    <button type="button" id="fluxo_receita" onclick="setFluxo('Receita')" class="py-2.5 rounded-xl font-bold text-xs bg-gray-100 text-gray-600 border">Receita</button>
                    <button type="button" id="fluxo_cartao" onclick="setFluxo('Cartão')" class="py-2.5 rounded-xl font-bold text-xs bg-gray-100 text-gray-600 border">Cartão de Crédito</button>
                    <button type="button" id="fluxo_transferencia" onclick="setFluxo('Transferência')" class="py-2.5 rounded-xl font-bold text-xs bg-gray-100 text-gray-600 border">Transferência</button>
                </div>

                <form id="financeForm" class="space-y-4 relative">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Quanto?</label>
                        <input type="text" id="valorFalsoInput" inputmode="numeric" required placeholder="R$ 0,00" class="w-full p-3 border rounded-xl text-xl font-bold focus:ring-2 focus:ring-purple-500 outline-none" oninput="mascaraMoeda(this)">
                        <input type="hidden" id="valorInput" step="0.01">
                    </div>

                    <div class="relative">
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">O quê? (Descrição)</label>
                        <input type="text" id="descricaoInput" autocomplete="off" required placeholder="Ex: Mercado" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-purple-500 outline-none" oninput="lidarAutocomplete(this.value)">
                        <div id="boxSugestoes" class="hidden absolute left-0 right-0
